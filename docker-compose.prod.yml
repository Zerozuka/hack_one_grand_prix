services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_mesh}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_mesh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_mesh} -d ${POSTGRES_DB:-knowledge_mesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_mesh}:${POSTGRES_PASSWORD:-knowledge_mesh}@postgres:5432/${POSTGRES_DB:-knowledge_mesh}
      API_INTERNAL_JWT_SECRET: ${API_INTERNAL_JWT_SECRET:-change-me-in-production}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
      DEFAULT_COMMUNITY_ID: ${DEFAULT_COMMUNITY_ID:-campus-east}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:8000
      API_INTERNAL_JWT_SECRET: ${API_INTERNAL_JWT_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:8080}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
      DEFAULT_COMMUNITY_ID: ${DEFAULT_COMMUNITY_ID:-campus-east}
      NEXT_PUBLIC_ENABLE_OIDC: ${NEXT_PUBLIC_ENABLE_OIDC:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
